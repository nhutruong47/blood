spring.application.name=blood

## Server Configuration
server.port=8080
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Forward X-Forwarded-* headers when sitting behind a reverse proxy/L7 LB.
server.forward-headers-strategy=framework
## HTTP response compression reduces payload size for JSON-heavy endpoints.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

## SQL Server DB connection
## The app MUST connect as the dedicated `blood_app` login (provisioned by the
## `init-db` one-shot service in docker-compose). `sa` is reserved for the
## init-db service and for operator-level maintenance; it is never injected
## into the running app's environment. In a local dev setup outside docker
## compose, run the init SQL once as sa and then point the app at blood_app.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BLOOD;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:blood_app}
spring.datasource.password=${DB_PASSWORD:StrongPassword123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=blood-pool

## Hibernate JPA settings
## - In dev (no Flyway): use 'create-drop' or 'update' (set JPA_DDL_AUTO env var).
## - In prod (with Flyway): 'validate' so Hibernate checks schema parity without altering it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

## JWT Security
## CRITICAL: JWT_SECRET MUST be set in every non-dev environment.
## Minimum length: 32 characters (256-bit key for HS256).
## The application refuses to start if JWT_SECRET is missing or too short.
app.jwt-secret=${JWT_SECRET:}
# Access tokens: 1 hour (refresh tokens rotate after this).
app.jwt-expiration-milliseconds=${JWT_EXPIRATION:3600000}
# Refresh tokens: 14 days.
app.jwt-refresh-expiration-milliseconds=${JWT_REFRESH_EXPIRATION:1209600000}

## Rate Limiting
rate.limit.enabled=true

## Actuator & Monitoring
# Only expose the read-only endpoints. Sensitive endpoints (env, heapdump,
# configprops) require authentication.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}

## Flyway Migration settings
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

## CORS (Production)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

## Security headers
# HSTS max-age (seconds). 0 disables HSTS so HTTPS-only deployments can flip
# it on without code changes.
app.security.headers.hsts-max-age=${HSTS_MAX_AGE:0}

## Logging
# LOG_APPENDER selects between human-readable CONSOLE and JSON. JSON is the
# default in any containerised environment so log aggregators (Loki, ES,
# Cloud Logging) can ingest structured events.
LOG_APPENDER=${LOG_APPENDER:CONSOLE}
logging.level.root=INFO
logging.level.com.nhutruong.blood=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

## Mail (SMTP) — used by the Password Reset flow.
## All values MUST be set via env vars in any non-dev environment.
## Leaving MAIL_USERNAME / MAIL_PASSWORD blank disables actual delivery but
## the app still boots (EmailService logs WARN and the reset API still responds).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

## From-address shown on outgoing transactional mail.
app.mail.from=${MAIL_FROM:noreply@blood.app}

## Base URL prepended to the opaque reset token in the password-reset email.
## In production override this to the deployed portal/frontend route.
## The current implementation points directly at the backend API endpoint
## (which already supports the token via POST /api/reset-password).
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:8080/api/reset-password?token=}

## Gracefully degrade if SMTP is unreachable (true = log WARN, never block the reset flow).
app.password-reset.fail-soft=${PASSWORD_RESET_FAIL_SOFT:true}
