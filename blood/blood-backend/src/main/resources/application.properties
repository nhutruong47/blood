spring.application.name=blood

## Server Configuration
server.port=8080
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Forward X-Forwarded-* headers when sitting behind a reverse proxy/L7 LB.
server.forward-headers-strategy=framework
## HTTP response compression reduces payload size for JSON-heavy endpoints.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

## SQL Server DB connection
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BLOOD;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:StrongPassword123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=blood-pool

## Hibernate JPA settings
## - In dev (no Flyway): use 'create-drop' or 'update' (set JPA_DDL_AUTO env var).
## - In prod (with Flyway): 'validate' so Hibernate checks schema parity without altering it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

## JWT Security
## CRITICAL: JWT_SECRET MUST be set in every non-dev environment.
## Minimum length: 32 characters (256-bit key for HS256).
## The application refuses to start if JWT_SECRET is missing or too short.
app.jwt-secret=${JWT_SECRET:}
# Access tokens: 1 hour (refresh tokens rotate after this).
app.jwt-expiration-milliseconds=${JWT_EXPIRATION:3600000}
# Refresh tokens: 14 days.
app.jwt-refresh-expiration-milliseconds=${JWT_REFRESH_EXPIRATION:1209600000}

## Rate Limiting
rate.limit.enabled=true

## Actuator & Monitoring
# Only expose the read-only endpoints. Sensitive endpoints (env, heapdump,
# configprops) require authentication.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}

## Flyway Migration settings
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

## CORS (Production)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

## Security headers
# HSTS max-age (seconds). 0 disables HSTS so HTTPS-only deployments can flip
# it on without code changes.
app.security.headers.hsts-max-age=${HSTS_MAX_AGE:0}

## Logging
# LOG_APPENDER selects between human-readable CONSOLE and JSON. JSON is the
# default in any containerised environment so log aggregators (Loki, ES,
# Cloud Logging) can ingest structured events.
LOG_APPENDER=${LOG_APPENDER:CONSOLE}
logging.level.root=INFO
logging.level.com.nhutruong.blood=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
