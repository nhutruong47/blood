spring.application.name=blood

## Server Configuration
server.port=8080
server.shutdown=graceful

## SQL Server DB connection
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BLOOD;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:StrongPassword123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

## Hibernate JPA settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

## JWT Security
app.jwt-secret=${JWT_SECRET:your-super-secret-key-that-is-at-least-32-characters-long}
app.jwt-expiration-milliseconds=${JWT_EXPIRATION:86400000}

## Rate Limiting
rate.limit.enabled=true

## Actuator & Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

## Flyway Migration settings
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

## Logging
logging.level.root=INFO
logging.level.com.nhutruong.blood=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.org.springframework.security=DEBUG

## CORS (Production)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
