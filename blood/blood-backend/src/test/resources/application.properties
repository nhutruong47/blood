# Test-only configuration. Overrides the empty JWT_SECRET placeholder from
# src/main/resources/application.properties so smoke tests can run locally
# without exporting a real secret.
#
# This file is only loaded by Spring's test framework. It is NOT deployed.

app.jwt-secret=0123456789abcdef0123456789abcdef-test-only-do-not-use-in-prod
spring.flyway.enabled=false