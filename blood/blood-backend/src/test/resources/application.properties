# Test-only configuration. Overrides the empty JWT_SECRET placeholder from
# src/main/resources/application.properties so smoke tests can run locally
# without exporting a real secret.
#
# This file is only loaded by Spring's test framework. It is NOT deployed.

app.jwt-secret=0123456789abcdef0123456789abcdef-test-only-do-not-use-in-prod
spring.flyway.enabled=false

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true