version: '3.8'

services:
  app:
    build: ./blood-backend
    image: blood-backend:latest
    container_name: blood-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=BLOOD;encrypt=true;trustServerCertificate=true
      # blood_app is provisioned by the init-db one-shot service. The app
      # never connects as sa; DB_PASSWORD (sa's password) stays inside the
      # init-db service only.
      - DB_USERNAME=blood_app
      - DB_PASSWORD=${BLOOD_APP_PASSWORD:?Set BLOOD_APP_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET (>=32 chars) in .env}
      - JWT_EXPIRATION=3600000          # 1 hour (rotates every hour)
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - LOG_APPENDER=JSON                # structured logs for Loki/Elastic
      - HSTS_MAX_AGE=31536000           # enable HSTS in prod
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      sqlserver:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [blood]

  init-db:
    # One-shot provisioning of the dedicated `blood_app` SQL Server login.
    # Re-runs safely on every container recreate because every statement in
    # the mounted SQL files is guarded with IF NOT EXISTS / IF SUSER_ID IS NULL.
    image: mcr.microsoft.com/mssql-tools18:latest
    container_name: blood-init-db
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - BLOOD_APP_PASSWORD=${BLOOD_APP_PASSWORD:?Set BLOOD_APP_PASSWORD in .env}
    volumes:
      - ./blood-backend/db/init:/init:ro
    entrypoint: ["bash", "-lc"]
    command:
      - >-
        set -euo pipefail;
        for f in /init/*.sql; do
          echo "[init-db] applying $$f";
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -No -i "$$f" -v BLOOD_APP_PASSWORD="$$BLOOD_APP_PASSWORD";
        done;
        echo "[init-db] done";
    restart: "no"
    networks: [blood]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: blood-sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C -No || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [blood]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: blood-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks: [blood]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: blood-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks: [blood]

  loki:
    image: grafana/loki:3.3.2
    container_name: blood-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [blood]

  promtail:
    image: grafana/promtail:3.3.2
    container_name: blood-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks: [blood]

volumes:
  # sqlserver-data is the durable state of the database itself. The login
  # `blood_app` is provisioned by the init-db service on every cold start, so
  # the login survives even if this volume is recreated from scratch.
  # Operators MUST take regular backups with ./scripts/backup-db.sh.
  sqlserver-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  blood:
    driver: bridge
