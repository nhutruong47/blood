version: '3.8'

services:
  app:
    build: ./blood-backend
    image: blood-backend:latest
    container_name: blood-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=BLOOD;encrypt=true;trustServerCertificate=true
      - DB_USERNAME=sa
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET (>=32 chars) in .env}
      - JWT_EXPIRATION=3600000          # 1 hour (rotates every hour)
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - LOG_APPENDER=JSON                # structured logs for Loki/Elastic
      - HSTS_MAX_AGE=31536000           # enable HSTS in prod
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [blood]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: blood-sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C -No || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [blood]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: blood-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks: [blood]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: blood-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks: [blood]

  loki:
    image: grafana/loki:3.3.2
    container_name: blood-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [blood]

  promtail:
    image: grafana/promtail:3.3.2
    container_name: blood-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks: [blood]

volumes:
  sqlserver-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  blood:
    driver: bridge
